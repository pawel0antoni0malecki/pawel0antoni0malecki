name: Update README XP

on:
  schedule:
    - cron: '0 3 * * *'   # codziennie o 3:00 UTC
  push:
    branches: [main]
  workflow_dispatch:       # pozwala odpalić ręcznie z zakładki Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Uruchom skrypt XP
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commituj zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md xp_data.json
          git commit -m "🔄 Aktualizacja poziomu XP" || echo "Brak zmian"
          git push
